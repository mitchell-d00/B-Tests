name: Refresh test archive index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b-tests-test-index-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and publish the current index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            # This checkout is disposable and the generated files can be rebuilt.
            git reset --hard origin/main
            python -m tools.build_test_index
            python -m tools.build_test_index --check
            git add docs/TEST_INDEX.md research/test-index.json research/test-inventory.jsonl
            if git diff --cached --quiet; then
              echo "The test index is current."
              exit 0
            fi
            git commit -m "Refresh generated B-Tests index"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
